        body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
}

.weather-app {
    width: 400px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(15px);
    border-radius: 15px;
    box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
    padding: 30px 40px;
    text-align: center;
    color: #fff;
}

h1 {
    font-weight: 700;
    font-size: 2.5rem;
    margin-bottom: 25px;
    text-shadow: 0 2px 5px rgba(0,0,0,0.3);
}

#Weather {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 25px;
}

input {
    padding: 12px 15px;
    width: 70%;
    border: none;
    border-radius: 30px;
    font-size: 1rem;
    outline: none;
    transition: box-shadow 0.3s ease;
    background: rgba(255, 255, 255, 0.25);
    color: #fff;
    box-shadow: inset 0 0 5px rgba(255,255,255,0.3);
}

input::placeholder {
    color: #e0e0e0;
}

input:focus {
    box-shadow: 0 0 10px 2px #a18cd1;
    background: rgba(255, 255, 255, 0.4);
}

button {
    padding: 12px 25px;
    background: #6a11cb;  /* Purple gradient start */
    background: linear-gradient(45deg, #6a11cb, #2575fc);
    border: none;
    border-radius: 30px;
    color: white;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(101, 41, 255, 0.4);
    transition: background 0.3s ease, box-shadow 0.3s ease;
}

button:hover {
    background: linear-gradient(45deg, #2575fc, #6a11cb);
    box-shadow: 0 6px 20px rgba(101, 41, 255, 0.7);
}

#weather-result {
    margin-top: 20px;
    font-size: 1.3rem;
    background: rgba(255, 255, 255, 0.25);
    padding: 20px;
    border-radius: 15px;
    box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.3);
    min-height: 80px;
    line-height: 1.5;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3);
}


    </style>
</head>

<body>

    <div class="weather-app">
        <h1>Weather App</h1>
        <div id="Weather">
            <input type="text" id="search" placeholder="Enter city name" required>
            <button type="submit">Get Weather</button>
        </div>
        <div id="weather-result"></div>

    </div>

    <script>
        let btn = document.querySelector('button');
        btn.addEventListener("click", () => {
            const city = (document.querySelector('#search').value);
            fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=46b352f05f0a95e00f7ad7bf051e3503`)
                .then(response => response.json())
                .then(data => {
                    let weatherResult = document.querySelector('#weather-result');
                    weatherResult.innerHTML = `city: ${data.name}
                     <br> Temperature: ${(data.main.temp - 273).toFixed(2)}°C <br> Weather:
                      ${data.weather[0].description}`;
                    // console.log(city);
                    // console.log(data.main.temp-273 + "°C");
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        });



    </script>

</body>
